<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtro facial</title>
    <link rel="stylesheet" href="css/app.css">

    <!-- Los modulos de three.js (exportadores, etc.) importan "three" -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.181.1/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.1/examples/jsm/"
        }
    }
    </script>
</head>

<body>
    <button id="enable-sound" type="button" style="
        position:fixed; z-index:10001; top:16px; left:50%; transform:translateX(-50%);
        padding:12px 18px; border:0; border-radius:999px; background:#171717;
        color:#fff; font:600 14px Arial,sans-serif; cursor:pointer;
        box-shadow:0 4px 18px rgba(0,0,0,.3);">
        Activar sonido de tambores
    </button>
    <div id="app">
        <video id="video-renderer"></video>
        <canvas id="canvas-renderer"></canvas>
    </div>

    <script type="module">
        import { startFaceFilter } from "./js/mediapipe/mediapipe_controller.js";

        // Escena exportada desde el editor de three.js. Por defecto app.json;
        // para probar otra sin tocar el codigo: index.html?json=app_hulk.json
        const scene = new URLSearchParams(location.search).get("json") || "app.json";

        const filter = await startFaceFilter(scene);
        const soundButton = document.getElementById("enable-sound");
        soundButton.addEventListener("click", async () => {
            const enabled = await filter.mouthDrums.unlock();
            soundButton.textContent = enabled ? "Sonido activado — abre la boca" : "No se pudo activar el sonido";
            soundButton.style.background = enabled ? "#176b36" : "#8b1e1e";
        });
    </script>
</body>

</html>
